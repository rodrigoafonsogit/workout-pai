<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 430" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif">
  <style>
    .bg { fill: #f2f2f7; }
    .mat { fill: #d1d1d6; }
    .body { stroke: #1c1c1e; fill: none; stroke-width: 18; stroke-linecap: round; stroke-linejoin: round; }
    .head { fill: #1c1c1e; }
    .accent { fill: #34c759; }
    .accent-s { stroke: #34c759; fill: none; stroke-width: 5; stroke-linecap: round; }
    .t1 { fill: #1c1c1e; font-size: 26px; font-weight: 700; }
    .t2 { fill: #6c6c70; font-size: 20px; }
    .num { fill: #fff; font-size: 18px; font-weight: 700; }
    @media (prefers-color-scheme: dark) {
      .bg { fill: #2c2c2e; }
      .mat { fill: #48484a; }
      .body { stroke: #f2f2f7; }
      .head { fill: #f2f2f7; }
      .t1 { fill: #f2f2f7; }
      .t2 { fill: #aeaeb2; }
      .accent { fill: #30d158; }
      .accent-s { stroke: #30d158; }
    }
    .tronco {
      transform-box: view-box;
      transform-origin: 228px 370px;
      animation: sobe 3.2s ease-in-out infinite;
    }
    .seta { animation: pisca 3.2s ease-in-out infinite; }
    @keyframes sobe {
      0%, 12% { transform: rotate(0deg); }
      42%, 58% { transform: rotate(38deg); }
      88%, 100% { transform: rotate(0deg); }
    }
    @keyframes pisca {
      0%, 10% { opacity: 0; }
      25%, 45% { opacity: 1; }
      60%, 100% { opacity: 0; }
    }
  </style>

  <rect class="bg" width="640" height="430"/>

  <!-- Instruções -->
  <g transform="translate(28 48)">
    <circle class="accent" cx="15" cy="-8" r="15"/><text class="num" x="15" y="-2" text-anchor="middle">1</text>
    <text class="t1" x="42" y="0">Deitado, joelhos fletidos</text>
    <text class="t2" x="42" y="27">Pés no chão, braços cruzados no peito</text>
  </g>
  <g transform="translate(28 118)">
    <circle class="accent" cx="15" cy="-8" r="15"/><text class="num" x="15" y="-2" text-anchor="middle">2</text>
    <text class="t1" x="42" y="0">Sobe só os ombros</text>
    <text class="t2" x="42" y="27">Expira ao subir · lombar sempre no chão</text>
  </g>
  <g transform="translate(28 188)">
    <circle class="accent" cx="15" cy="-8" r="15"/><text class="num" x="15" y="-2" text-anchor="middle">3</text>
    <text class="t1" x="42" y="0">Desce devagar</text>
    <text class="t2" x="42" y="27">Não puxes o pescoço com as mãos</text>
  </g>

  <!-- Tapete -->
  <rect class="mat" x="50" y="388" width="540" height="14" rx="7"/>

  <!-- Pernas (paradas) -->
  <polyline class="body" points="310,370 418,286 500,378"/>
  <line class="body" x1="500" y1="378" x2="540" y2="378"/>

  <!-- Seta de movimento -->
  <path class="accent-s seta" d="M58 340 Q 52 278 96 248"/>
  <path class="accent seta" d="M100 245 l -18 0 l 6 16 z"/>

  <!-- Tronco, cabeça e braços (animados) -->
  <line class="body" x1="310" y1="370" x2="228" y2="370"/>
  <g class="tronco">
    <line class="body" x1="228" y1="370" x2="138" y2="370"/>
    <circle class="head" cx="100" cy="358" r="27"/>
    <polyline class="body" points="152,362 202,338 238,362"/>
  </g>
</svg>
